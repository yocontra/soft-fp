name: Calibrate benchmark on released code

on:
  push:
    branches: [release/2.0.2-validation]

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out released 2.0.1 sources
        id: source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fd3b68a18552631ab29d501c8ceec6a72a3791e2
          persist-credentials: false

      - name: Configure released benchmark
        run: |
          cmake -S . -B build-bench -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSOFT_FP64_BUILD_BENCH=ON \
            -DSOFT_FP64_BUILD_TESTS=OFF

      - name: Build released benchmark
        run: cmake --build build-bench --parallel --target bench_soft_fp64

      - name: Check out release candidate separately
        id: candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false

      - name: Build release candidate before measurements
        run: |
          cmake -S candidate -B candidate/build-bench -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSOFT_FP64_BUILD_BENCH=ON \
            -DSOFT_FP64_BUILD_TESTS=OFF
          cmake --build candidate/build-bench --parallel --target bench_soft_fp64

      - name: Record measurement environment
        env:
          CHECKED_OUT_COMMIT: ${{ steps.source.outputs.commit }}
          CANDIDATE_COMMIT: ${{ steps.candidate.outputs.commit }}
        run: |
          mkdir -p calibration
          python3 - <<'PY'
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          def output(*args):
              return subprocess.check_output(args, text=True).strip()

          source_commit = "fd3b68a18552631ab29d501c8ceec6a72a3791e2"
          if os.environ["CHECKED_OUT_COMMIT"] != source_commit:
              raise SystemExit("Checkout did not resolve to the pinned released commit")
          if os.environ["CANDIDATE_COMMIT"] != os.environ["GITHUB_SHA"]:
              raise SystemExit("Candidate checkout did not resolve to the triggering commit")
          binary = Path("build-bench/bench/bench_soft_fp64")
          candidate_binary = Path("candidate/build-bench/bench/bench_soft_fp64")
          metadata = {
              "source_commit": source_commit,
              "source_version": "2.0.1",
              "candidate_commit": os.environ["CANDIDATE_COMMIT"],
              "candidate_configure_args": [
                  "-S", "candidate", "-B", "candidate/build-bench", "-G", "Unix Makefiles",
                  "-DCMAKE_BUILD_TYPE=Release", "-DSOFT_FP64_BUILD_BENCH=ON",
                  "-DSOFT_FP64_BUILD_TESTS=OFF",
              ],
              "candidate_build_args": [
                  "--build", "candidate/build-bench", "--parallel", "--target", "bench_soft_fp64",
              ],
              "candidate_measurement_args": ["--min-time-ms=500", "--json"],
              "candidate_binary_sha256": hashlib.sha256(candidate_binary.read_bytes()).hexdigest(),
              "recorded_at": datetime.now(timezone.utc).isoformat(),
              "hardware": output("sysctl", "-n", "machdep.cpu.brand_string"),
              "cpu_count": output("sysctl", "-n", "hw.ncpu"),
              "os": output("sw_vers"),
              "architecture": output("uname", "-m"),
              "compiler": output("clang", "--version"),
              "cmake": output("cmake", "--version"),
              "build_type": "Release",
              "fenv": "tls",
              "configure_args": [
                  "-S", ".", "-B", "build-bench", "-G", "Unix Makefiles",
                  "-DCMAKE_BUILD_TYPE=Release", "-DSOFT_FP64_BUILD_BENCH=ON",
                  "-DSOFT_FP64_BUILD_TESTS=OFF",
              ],
              "build_args": ["--build", "build-bench", "--parallel", "--target", "bench_soft_fp64"],
              "measurement_args": ["--min-time-ms=1000", "--json"],
              "method": "three sequential released-code runs; diagnostic per-operation minimum; candidate measured separately",
              "runner": {key: os.environ.get(key) for key in [
                  "ImageOS", "ImageVersion", "RUNNER_OS", "RUNNER_ARCH",
                  "RUNNER_ENVIRONMENT", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT",
                  "GITHUB_REPOSITORY", "GITHUB_WORKFLOW_REF", "GITHUB_SHA",
              ]},
              "binary_sha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
          }
          Path("calibration/environment.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY
          cp build-bench/CMakeCache.txt calibration/CMakeCache.txt
          cp build-bench/CMakeFiles/soft_fp64.dir/flags.make calibration/library-flags.make
          cp build-bench/bench/CMakeFiles/bench_soft_fp64.dir/flags.make calibration/benchmark-flags.make
          cp candidate/build-bench/CMakeCache.txt calibration/candidate-CMakeCache.txt
          cp candidate/build-bench/CMakeFiles/soft_fp64.dir/flags.make calibration/candidate-library-flags.make
          cp candidate/build-bench/bench/CMakeFiles/bench_soft_fp64.dir/flags.make calibration/candidate-benchmark-flags.make

      - name: Collect three released-code samples
        run: |
          for sample in 1 2 3; do
            build-bench/bench/bench_soft_fp64 --min-time-ms=1000 --json > "calibration/run-${sample}.json"
          done

      - name: Measure candidate with the normal CI window
        run: candidate/build-bench/bench/bench_soft_fp64 --min-time-ms=500 --json > calibration/candidate.json

      - name: Compare candidate against old-code sample minima
        run: |
          python3 - <<'PYTHON'
          import json
          import math
          from pathlib import Path

          root = Path("calibration")
          runs = [json.loads((root / f"run-{sample}.json").read_text()) for sample in (1, 2, 3)]
          by_name = []
          for run in runs:
              if run["schema"] != "soft-fp64.bench.v1":
                  raise SystemExit("Unexpected old-code sample schema")
              for row in run["results"]:
                  if not math.isfinite(row["ns_per_op"]) or row["ns_per_op"] <= 0:
                      raise SystemExit("Invalid timing in old-code sample")
              rows = {row["name"]: row for row in run["results"]}
              if not rows or len(rows) != len(run["results"]):
                  raise SystemExit("Empty or duplicate operation in old-code sample")
              by_name.append(rows)
          if any(set(rows) != set(by_name[0]) for rows in by_name[1:]):
              raise SystemExit("Old-code samples have different operation sets")
          diagnostic = {
              "schema": "soft-fp64.bench.v1",
              "environment": json.loads((root / "environment.json").read_text()),
              "results": [
                  min((rows[name] for rows in by_name), key=lambda row: row["ns_per_op"])
                  for name in sorted(by_name[0])
              ],
          }
          (root / "old-code-minima.json").write_text(json.dumps(diagnostic, indent=2) + "\n")
          PYTHON
          python3 candidate/bench/compare.py calibration/candidate.json calibration/old-code-minima.json \
            --threshold=0.20 --cheap-op-absolute-budget=5.0 > calibration/candidate-comparison.md

      - name: Upload raw calibration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: released-2.0.1-macos26-calibration
          path: calibration/
          if-no-files-found: error
          retention-days: 30
